name: Build ZStartup

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $pkg) {
            Write-Error "Version mismatch: tauri.conf.json=$version package.json=$pkg"
            exit 1
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match app version v$version"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run tauri build

      - name: Collect installers
        id: collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $out = "dist-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src-tauri/target/release/bundle/msi/ZStartup_${v}_x64_en-US.msi" $out
          Copy-Item "src-tauri/target/release/bundle/nsis/ZStartup_${v}_x64-setup.exe" $out
          Get-ChildItem $out | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content "$out/SHA256SUMS.txt"
          }
          Get-Content "$out/SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZStartup-${{ steps.version.outputs.version }}-windows-x64
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Draft GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ZStartup v${{ steps.version.outputs.version }}
          files: dist-release/*
          generate_release_notes: true
